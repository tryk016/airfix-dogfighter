name: Private signed iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-private-ipa
  cancel-in-progress: false

jobs:
  boundary:
    name: Require private trusted main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce private repository and trusted ref
        env:
          AIRFIX_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$AIRFIX_REPOSITORY_PRIVATE" != "true" ]]; then
            echo "private signed IPA workflow is disabled in a public repository" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "private signed IPA workflow is restricted to main" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow source revision is invalid" >&2
            exit 1
          fi

  sign:
    name: Build and verify private Ad Hoc IPA
    needs: boundary
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: ios-private
    steps:
      - name: Check out trusted source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm immutable source revision
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "checked-out revision does not match the dispatched main SHA" >&2
            exit 1
          fi

      - name: Preflight Apple toolchain and public boundary
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          python3 tools/ci/check_public_boundary.py .
          python3 tests/IosPrivateSigningTests.py

      - name: Build, sign, export, and verify IPA
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          AIRFIX_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          AIRFIX_IOS_TEAM_ID: ${{ vars.AIRFIX_IOS_TEAM_ID }}
          AIRFIX_IOS_BUNDLE_IDENTIFIER: ${{ vars.AIRFIX_IOS_BUNDLE_IDENTIFIER }}
          AIRFIX_IOS_PROFILE_NAME: ${{ vars.AIRFIX_IOS_PROFILE_NAME }}
          AIRFIX_IOS_SIGNING_IDENTITY: ${{ vars.AIRFIX_IOS_SIGNING_IDENTITY }}
          AIRFIX_IOS_DEVICE_UDID_PRIMARY: ${{ secrets.AIRFIX_IOS_DEVICE_UDID_PRIMARY }}
          AIRFIX_IOS_DEVICE_UDID_SECONDARY: ${{ secrets.AIRFIX_IOS_DEVICE_UDID_SECONDARY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          AIRFIX_IOS_INITIAL_SETUP_LOGICAL_PATH_BASE64: ${{ secrets.AIRFIX_IOS_INITIAL_SETUP_LOGICAL_PATH_BASE64 }}
          AIRFIX_IOS_INITIAL_LEVEL_LOGICAL_PATH_BASE64: ${{ secrets.AIRFIX_IOS_INITIAL_LEVEL_LOGICAL_PATH_BASE64 }}
          AIRFIX_IOS_INITIAL_PLAYER_OBJECT_LOGICAL_PATH_BASE64: ${{ secrets.AIRFIX_IOS_INITIAL_PLAYER_OBJECT_LOGICAL_PATH_BASE64 }}
          AIRFIX_IOS_INITIAL_START_INDEX: ${{ vars.AIRFIX_IOS_INITIAL_START_INDEX }}
        run: bash tools/ci/build_ios_private_ipa.sh

      - name: Upload private IPA for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirfixDogfighter-private-${{ github.sha }}
          path: ${{ runner.temp }}/airfix-private-output-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove private output from runner
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/airfix-private-output-$GITHUB_RUN_ID"
