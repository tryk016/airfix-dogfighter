name: Unsigned iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  policy:
    name: iOS change policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_build: ${{ steps.classify_pr.outputs.full_build || steps.classify_full.outputs.full_build }}

    steps:
      - name: Check out sources and revision history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify pull-request changes
        id: classify_pr
        if: github.event_name == 'pull_request'
        run: >-
          python3 tools/ci/classify_ci_changes.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --three-dot
          --github-output "$GITHUB_OUTPUT"

      - name: Require complete matrix for non-PR events
        id: classify_full
        if: github.event_name != 'pull_request'
        run: >-
          python3 tools/ci/classify_ci_changes.py
          --force-full
          --github-output "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.sdk }}
    needs: policy
    if: needs.policy.outputs.full_build == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - iphonesimulator
          - iphoneos

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Preflight Apple toolchain
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          xcrun --sdk "${{ matrix.sdk }}" --show-sdk-version
          cmake --version
          clang --version

      - name: Enforce public source boundary
        run: python3 tools/ci/check_public_boundary.py .

      - name: Validate simulator smoke result contract
        if: matrix.sdk == 'iphonesimulator'
        run: python3 tools/ci/test_ios_simulator_smoke_validator.py

      - name: Configure Xcode project
        run: |
          simulator_smoke=OFF
          if [[ "${{ matrix.sdk }}" == "iphonesimulator" ]]; then
            simulator_smoke=ON
          fi
          cmake -S . -B "build-${{ matrix.sdk }}" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${{ matrix.sdk }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DAIRFIX_IOS_DEPLOYMENT_TARGET=16.4 \
            -DAIRFIX_BUILD_TESTS=OFF \
            -DAIRFIX_BUILD_TOOLS=OFF \
            -DAIRFIX_BUILD_IOS_APP=ON \
            -DAIRFIX_IOS_SIMULATOR_SMOKE="$simulator_smoke"

      - name: Build without signing
        run: |
          cmake --build "build-${{ matrix.sdk }}" \
            --config Debug --target airfix_ios -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Verify data-less bundle
        run: bash tools/ci/verify-ios-bundle.sh "build-${{ matrix.sdk }}" "${{ matrix.sdk }}"

      - name: Run data-less simulator Metal and lifecycle smoke
        if: matrix.sdk == 'iphonesimulator'
        run: |
          bundles="$(find "build-${{ matrix.sdk }}" -type d -name AirfixDogfighter.app -print)"
          bundle_count="$(printf '%s\n' "$bundles" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$bundle_count" != "1" ]]; then
            echo "expected exactly one simulator application bundle" >&2
            exit 1
          fi
          bundle="$(printf '%s\n' "$bundles" | sed -n '1p')"
          python3 tools/ci/run-ios-simulator-smoke.py \
            --app "$bundle" \
            --result-output "build-${{ matrix.sdk }}/simulator-smoke-result.json" \
            --timeout-seconds 60
