name: Portable C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx-flags: ""
            linker-flags: ""
          - os: windows-2025
            cxx-flags: "/fsanitize=address /Zi"
            linker-flags: "/INCREMENTAL:NO /DEBUG"
          - os: macos-26
            cxx-flags: ""
            linker-flags: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show toolchain
        run: cmake --version

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAIRFIX_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx-flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker-flags }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
